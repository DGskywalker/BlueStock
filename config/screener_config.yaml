# Screener Configuration YAML (config/screener_config.yaml)
# Defines preset screening rules and threshold parameters for the 6 Financial Presets

presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High ROE (>16.5%), low debt (D/E < 0.35), positive FCF, and strong 5-year revenue CAGR (>10%)."
    filters:
      return_on_equity_pct_min: 16.5
      debt_to_equity_max: 0.35
      free_cash_flow_cr_min: 0.0
      revenue_cagr_5yr_min: 10.0

  value_pick:
    name: "Value Pick"
    description: "Low P/E (<22), low P/B (<3.5), moderate leverage, and attractive dividend yield."
    filters:
      pe_ratio_max: 22.0
      pb_ratio_max: 3.5
      debt_to_equity_max: 0.8
      dividend_yield_min: 1.0

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High 5-year PAT and Revenue CAGR with controlled debt."
    filters:
      pat_cagr_5yr_min: 12.0
      revenue_cagr_5yr_min: 10.0
      debt_to_equity_max: 0.8

  dividend_champion:
    name: "Dividend Champion"
    description: "High dividend yield (>1.5%), reasonable payout ratio (<70%), and positive FCF."
    filters:
      dividend_yield_min: 1.5
      dividend_payout_ratio_pct_max: 70.0
      free_cash_flow_cr_min: 0.0

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero/Low debt (D/E <= 0.35), strong ROE (>15%), and large-scale revenue (> ₹5,000 Cr)."
    filters:
      debt_to_equity_max: 0.35
      return_on_equity_pct_min: 15.0
      sales_min: 5000.0

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Rebounding 3-year revenue CAGR (>10%), positive latest FCF, and controlled leverage."
    filters:
      revenue_cagr_3yr_min: 10.0
      free_cash_flow_cr_min: 0.0
      debt_to_equity_max: 0.35
